  <text x="620" y="176" fill="#0054FD" font-family="Arial" font-size="17" font-weight="700">Финансы</text><text x="620" y="224" fill="#172234" font-family="Arial" font-size="35" font-weight="700">Расскажите о доходе</text><text x="620" y="257" fill="#637083" font-family="Arial" font-size="16">Достаточно примерной суммы в месяц.</text>
